[project]
name = "idt-redteam"
version = "0.1.0"
description = "Red-teaming an agentic clinical copilot with poisoned chart notes. All data is synthetic."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The system under attack, pinned to the commit the study ran against.
    "idt-prep-copilot @ git+https://github.com/ethancooley/idt-prep-copilot@47a7ba6926321f45201aeec5b2f9065069f21db8",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",  # the attack lab's server function (api/lab.py)
]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
idt-redteam-benchmark = "idt_redteam.benchmark:main"
idt-redteam-load = "idt_redteam.loader:main"
idt-redteam-run = "idt_redteam.harness:main"
idt-redteam-export = "idt_redteam.web_export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
